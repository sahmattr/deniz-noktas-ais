name: AIS anlık görüntü

# Her 20 dakikada bir Türkiye denizleri için bir AIS anlık görüntüsü alır ve
# "ais-veri" dalına yazar. Uygulama o dosyayı indirir; anahtar yalnız burada,
# depo gizlisinde durur ve hiçbir cihaza girmez.
#
# Bu iş AÇIK AIS deposunda koşar, haritanın özel deposunda değil. Sebep:
# raw.githubusercontent özel depoya jetonsuz 404 veriyor, uygulama dosyayı indiremiyor.
# GITHUB_TOKEN de yalnız kendi deposuna yazabildiği için işin açık depoda olması
# fazladan kişisel jeton ihtiyacını ortadan kaldırıyor. Ne toplayıcıda ne de
# ais.json içinde gizli bir şey var; anahtar depo gizlisinde kalıyor ve bu iş
# yalnız zamanlayıcı ile elle çalıştırmadan tetikleniyor (çatal isteği okuyamaz).
#
# Kurulum (bir kere):
#   1. aisstream.io → GitHub ile giriş → Account → Create API key
#   2. AÇIK depo → Settings → Secrets and variables → Actions → New repository secret
#      Ad: AIS_ANAHTAR   Değer: (anahtar)
#   3. Actions sekmesinden bu iş akışını bir kez elle çalıştır (Run workflow).
#
# Not: GitHub, 60 gün boyunca depoda insan eliyle bir hareket olmazsa zamanlanmış
# iş akışlarını kendiliğinden durdurur; bu işin kendi commit'leri bunu sıfırlamaz.
# Durursa Actions sekmesinden yeniden açılır.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ais
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # 5 dk dinleme + Pelyr beklemeleri (en çok 240 sn) + gönderme
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Önceki görüntü: tek pencere sahanın tamamını göstermez, demirli gemi
      # 3 dakikada bir yayın yapar. Eski kayıtlar ömürleri dolana dek taşınır.
      - name: Önceki görüntüyü al
        run: |
          git fetch origin ais-veri --depth 1 || echo "ais-veri dalı yok, ilk tur"
          git show origin/ais-veri:ais.json > onceki.json 2>/dev/null || rm -f onceki.json
          test -s onceki.json && echo "önceki görüntü alındı" || echo "önceki görüntü yok"

      - name: Anlık görüntüyü al
        env:
          AIS_ANAHTAR: ${{ secrets.AIS_ANAHTAR }}
          # İkinci kaynak, isteğe bağlı. Secret tanımlı değilse boş gelir ve
          # toplayıcı Pelyr'i sessizce atlar — tur yine aisstream ile tamamlanır.
          PELYR_ANAHTAR: ${{ secrets.PELYR_ANAHTAR }}
        run: |
          if [ -s onceki.json ]; then node ais_topla.mjs cikti/ais.json onceki.json
          else node ais_topla.mjs cikti/ais.json; fi

      - name: Veri dalına yaz
        run: |
          set -e
          test -s cikti/ais.json
          UZAK="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          rm -rf .ais
          ZORLA=""
          # Dalın UCUNA ekliyoruz. Eskiden her tur `git init` + `--force` ile
          # ilgisiz bir geçmiş basılıyordu; raw.githubusercontent dal adını bir
          # süre önbellekte tutuyor ve önbellekteki commit force-push'tan sonra
          # erişilemez olduğu için kullanıcı o aralıkta 404 alıyordu. Uç uca
          # eklenince eski commit erişilebilir kalıyor: en kötüsü bir tur eski
          # dosya gelir, 404 değil.
          if git clone -q --depth 100 --branch ais-veri "$UZAK" .ais 2>/dev/null; then
            SAYI=$(cd .ais && git rev-list --count HEAD)
            # Geçmiş şişmesin: günde bir mertebesinde sıfırla (20 dakikada bir
            # tur → 72 commit ≈ 1 gün). 404 penceresi de günde bir kez kalır.
            if [ "$SAYI" -ge 72 ]; then
              rm -rf .ais/.git
              (cd .ais && git init -q -b ais-veri)
              ZORLA="--force"
              echo "geçmiş $SAYI commit olmuş, sıfırlandı"
            fi
          else
            mkdir -p .ais
            (cd .ais && git init -q -b ais-veri)
            ZORLA="--force"
            echo "ais-veri dalı yok, kuruluyor"
          fi
          cp cikti/ais.json .ais/ais.json
          cd .ais
          git config user.name "ais-bot"
          git config user.email "ais-bot@users.noreply.github.com"
          git add ais.json
          # Dosya birebir aynıysa commit yok: boşa tur basmayalım.
          if git diff --cached --quiet; then
            echo "görüntü değişmedi, yazılmadı"
            exit 0
          fi
          git commit -q -m "AIS anlık görüntü $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q $ZORLA "$UZAK" ais-veri
          echo "yazıldı: https://raw.githubusercontent.com/${{ github.repository }}/ais-veri/ais.json"
